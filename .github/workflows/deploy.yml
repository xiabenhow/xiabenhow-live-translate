name: Deploy to Firebase (Hosting + Functions)

on:
  workflow_dispatch:   # 先手動觸發；GitHub Secrets 設好後把下面兩行解開就會 push 自動部署
  # push:
  #   branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install function deps
        run: cd functions && npm install
      - name: Write functions/.env from secrets
        run: |
          cat > functions/.env <<EOT
          OPENAI_KEY=${{ secrets.OPENAI_KEY }}
          LIVE_PIN=${{ secrets.LIVE_PIN }}
          LIVE_SECRET=${{ secrets.LIVE_SECRET }}
          EOT
      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
      - name: Deploy
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting,functions --project ${{ vars.FIREBASE_PROJECT }} --non-interactive --force
